<style>
  :root {
    --paper: #F1EBDD;

    --red: #E63B2E;
    --red-deep: #C8321F;
    --pad: clamp(18px, 3vw, 40px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* The page background: warm ivory with three soft, static pastel glows (blush top right, sage
     bottom left, lavender along the bottom). Each falls off over many stops so there is no
     visible edge, and none reaches the middle, which stays ivory behind the dominoes and text.
     The 3D canvas is transparent over it. */
  body {
    background-color: #F4EBDD;
    background-image:
      radial-gradient(ellipse 85% 80% at 100% 0%, rgba(235, 201, 198, .8) 0%, rgba(235, 201, 198, .62) 18%, rgba(235, 201, 198, .38) 38%, rgba(235, 201, 198, .17) 58%, rgba(235, 201, 198, .05) 78%, rgba(235, 201, 198, 0) 100%),
      radial-gradient(ellipse 78% 78% at 0% 100%, rgba(201, 220, 196, .55) 0%, rgba(201, 220, 196, .4) 20%, rgba(201, 220, 196, .23) 42%, rgba(201, 220, 196, .09) 64%, rgba(201, 220, 196, .02) 84%, rgba(201, 220, 196, 0) 100%),
      radial-gradient(ellipse 66% 56% at 50% 100%, rgba(207, 208, 231, .57) 0%, rgba(207, 208, 231, .42) 20%, rgba(207, 208, 231, .24) 42%, rgba(207, 208, 231, .09) 64%, rgba(207, 208, 231, .02) 84%, rgba(207, 208, 231, 0) 100%);
    color: var(--ink);
    font-family: "Hanken Grotesk", system-ui, sans-serif;   /* a free near-match for illoca's Graphik */
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; opacity: 0; transition: opacity .5s ease; }
  #scene.on { opacity: 1; }

  /* Minimal: the dominoes are the hero. One centred caption sits under them, placed by the
     camera fit; everything else is small mono type in the corners. */
  .ui {
    position: fixed; inset: 0; pointer-events: none;
    --t: max(var(--pad), env(safe-area-inset-top)); --r: max(var(--pad), env(safe-area-inset-right));
    --b: max(var(--pad), env(safe-area-inset-bottom)); --l: max(var(--pad), env(safe-area-inset-left));
  }
  .ui a, .ui button { pointer-events: auto; }
  .label {
    font: 500 12px/1.3 "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .corner { position: absolute; left: var(--l); right: var(--r); display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .top { top: var(--t); }
  .bottom { bottom: var(--b); }
  .bottom { justify-content: flex-end; }
  .sound { background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .sound:hover { color: var(--ink); }

  .caption {
    position: absolute; left: 50%; top: 64%; transform: translateX(-50%);
    width: min(620px, calc(100% - 2 * var(--pad)));
    display: grid; justify-items: center; text-align: center;
    opacity: 0; transition: opacity .4s ease;
  }
  .caption.placed { opacity: 1; }
  /* Frosted glass behind the caption and the corner labels. Over the plain paper it can't be
     seen; a marble that rolls underneath softens into a blur instead of cutting through the text. */
  .caption::before, .corner::before {
    content: ""; position: absolute; z-index: -1; pointer-events: none;
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
  }
  .caption::before {
    inset: -48px -90px;
    -webkit-mask-image: radial-gradient(closest-side, #000 45%, rgba(0, 0, 0, .5) 72%, transparent); mask-image: radial-gradient(closest-side, #000 45%, rgba(0, 0, 0, .5) 72%, transparent);
  }
  .corner { isolation: isolate; }
  .top::before { inset: calc(-1 * var(--t)) calc(-1 * var(--r)) -22px calc(-1 * var(--l)); -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .bottom::before { inset: -22px calc(-1 * var(--r)) calc(-1 * var(--b)) calc(-1 * var(--l)); -webkit-mask-image: linear-gradient(transparent, #000 45%); mask-image: linear-gradient(transparent, #000 45%); }
  h1 {
    /* after illoca's 404: a large, regular-weight grotesque in soft ink, so the blocks stay the loudest thing */
    margin: 0; font-weight: 400; color: #3A3631;
    font-size: clamp(30px, 2.2vw + 14px, 56px); line-height: 1.08; letter-spacing: -.03em; text-wrap: balance;
  }
  .caption p { margin: 10px 0 0; font-size: clamp(15px, .4vw + 10px, 18px); line-height: 1.5; color: var(--muted); text-wrap: balance; }
  .cta { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .home, .ghost {
    font: 500 clamp(15px, .25vw + 11.5px, 17px)/1 "Hanken Grotesk", system-ui, sans-serif; letter-spacing: -.005em;
    border-radius: 999px; padding: 13px 20px; text-decoration: none; cursor: pointer;
    transition: background-color .2s ease, border-color .2s ease, color .2s ease;
  }
  .home { color: var(--paper); background: var(--ink); border: 1px solid var(--ink); }
  .home:hover, .home.arrived { background: var(--red-deep); border-color: var(--red-deep); color: #fff; }
  .ghost { color: var(--ink); background: transparent; border: 1px solid var(--line); }
  .ghost:hover { border-color: var(--ink); }
  .ghost[hidden] { display: none; }
  .ghost:not([hidden]) { animation: appear .42s cubic-bezier(.22, .8, .24, 1) both; }
  @keyframes appear { from { opacity: 0; transform: translateX(-14px); } }
  @media (prefers-reduced-motion: reduce) { .ghost:not([hidden]) { animation: none; } }
  .home:focus-visible, .ghost:focus-visible, .sound:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }

  /* The hints are painted on the floor above the 404, each half gone once you have done what it
     says. Keyboard words only show where there is a keyboard. */
  .floor-text {
    position: fixed; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; white-space: nowrap;
    font: 500 40px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase;
    color: #73675A; opacity: 0; transition: opacity .6s ease;
  }
  .floor-text.on { opacity: 1; }
  .floor-text div { text-align: center; }
  .floor-text div + div { margin-top: 9px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (max-width: 560px) {
    .label { font-size: 11px; }
    .caption p { margin-top: 14px; }
    .cta { margin-top: 30px; }
  }
  .no-gl .floor-text, .no-gl .sound, .no-gl #reset { display: none; }

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const RAPIER_URL = 'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const coarse = matchMedia('(pointer: coarse)');
const $ = (id) => document.getElementById(id);

// One unit is one domino's height. A run spaces them a little over half a height apart,
// which is where a falling domino hits the next one hard and low enough to keep going.
const DOMINO = { w: 0.5, h: 1, t: 0.16 };
// The sign is low and wide: a tall one hid the hook's last blocks so they seemed to stand on it.
// A portrait phone is short of width, so there the 404 is built from far fewer blocks (smaller
// digits in block units), and each block and the sign come out much bigger on screen.
const NARROW = innerWidth / innerHeight < 0.75;
const HOME = NARROW ? { w: 3, h: 1.3, t: 0.4 } : { w: 3.8, h: 1.55, t: 0.45 };
const STEP = 0.55;          // centre to centre along a run
const GAP = 0.45;           // half the gap where one run meets the side of another
const GRAVITY = 27;
const PALETTE = ['#E63B2E', '#F28C28', '#F6C945', '#3BAA5C', '#2F6FD6', '#8A4FD3'];
const TRIGGER = THREE.MathUtils.degToRad(20);   // tipped far enough to be hitting the next one
const DOWN = THREE.MathUtils.degToRad(50);      // counts as fallen
const UPRIGHT = THREE.MathUtils.degToRad(4);
const Y = new THREE.Vector3(0, 1, 0);

// A seeded random so the wood grain and colour jitter look the same on every load.
let seed = 404;
const rand = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// ---------------------------------------------------------------------------------------------
// The layout: "404" drawn as runs of dominoes. Each run is a curve sampled at even spacing
// (the way manthrax lays his chains). Runs are joined by links; a link marked `assist` is a
// junction where the falling domino passes between two others, so the page gives the branch
// a tap at the moment of contact instead of trusting a glancing hit.
// ---------------------------------------------------------------------------------------------
const pieces = [];
const v2 = (x, z) => new THREE.Vector2(x, z);

function addPiece(x, z, fx, fz, kind = 'domino') {
  const size = kind === 'home' ? HOME : DOMINO;
  const f = new THREE.Vector2(fx, fz).normalize();
  const rest = new THREE.Quaternion().setFromAxisAngle(Y, Math.atan2(f.x, f.y));
  pieces.push({
    id: pieces.length, kind, ...size,
    fwd: new THREE.Vector3(f.x, 0, f.y),
    restPos: new THREE.Vector3(x, size.h / 2, z), restQuat: rest,
    pos: new THREE.Vector3(x, size.h / 2, z), quat: rest.clone(), up: new THREE.Vector3(0, 1, 0),
    next: [], prev: [], depth: -1, tilt: 0, fired: false, down: false, dir: 0, body: null, slept: false, inst: -1,
  });
  return pieces.length - 1;
}

function link(a, b, assist = false) {
  pieces[a].next.push({ id: b, assist });
  pieces[b].prev.push({ id: a, assist });
}

function addRun(curve) {
  const n = Math.max(1, Math.round(curve.getLength() / STEP));
  const ids = [];
  for (let i = 0; i <= n; i++) {
    const p = curve.getPointAt(i / n), t = curve.getTangentAt(i / n);
    ids.push(addPiece(p.x, p.y, t.x, t.y));
  }
  for (let i = 1; i < ids.length; i++) link(ids[i - 1], ids[i]);
  return { ids, first: ids[0], last: ids.at(-1) };
}

const path = (...curves) => { const p = new THREE.CurvePath(); curves.forEach((c) => p.add(c)); return p; };
const line = (a, b) => new THREE.LineCurve(a, b);

// On a phone the digits are about half the size in block units (roughly half the blocks), a
// little condensed, and the camera looks down more steeply.
const BAR = NARROW ? 1.25 : 1.8, TOP = NARROW ? -3.8 : -6, BOTTOM = -TOP;
const RX = NARROW ? 2.2 : 3.75, RZ = BOTTOM;    // the 0 is an ellipse
const FOUR_W = NARROW ? 4.4 : 8.5, STEM = NARROW ? 3.1 : 6, DIGIT_GAP = NARROW ? 2.8 : 3.2;
const LEAD = NARROW ? 1.2 : 2.2;                // the lead-in before the first 4
const BEND = NARROW ? 0.75 : 1.1;               // how wide the S-bends between digits swing
const LEFT = -(RX + DIGIT_GAP + FOUR_W);        // x of the first 4's left edge
const RIGHT = RX + DIGIT_GAP;                   // x of the second 4's left edge

// A 4: the bar runs from the left corner to the stem, where it splits up, down and on to the
// right. The diagonal branches off at the left corner and meets the stem at the apex.
function four(ox, into) {
  const sx = ox + STEM;
  const L = v2(ox, BAR), A = v2(sx, TOP);
  const dir = A.clone().sub(L).normalize();
  const bar = addRun(line(L, v2(sx - GAP, BAR)));
  // the diagonal stops short of the apex (further on the steeper condensed 4, or it brushes the stem)
  const diag = addRun(line(L.clone().addScaledVector(dir, 0.7), A.clone().addScaledVector(dir, NARROW ? -1.25 : -0.75)));
  const up = addRun(line(v2(sx, BAR - GAP), v2(sx, TOP + 0.3)));
  const down = addRun(line(v2(sx, BAR + GAP), v2(sx, BOTTOM)));
  link(into, bar.first);
  link(into, diag.first, true);
  link(bar.last, up.first, true);
  link(bar.last, down.first, true);
  return { bar, sx, rx: ox + FOUR_W };
}

const lead = addRun(line(v2(LEFT - LEAD, BAR), v2(LEFT - STEP, BAR)));
const START = lead.first;
const f1 = four(LEFT, lead.last);

// First 4 → 0: the rest of the bar, then an S-bend that arrives at the 0's left side. It stops
// far enough out that its last block, once down, ends flush with the 0 instead of poking in.
const ENTRY_END = -RX - 0.8;
const entry = addRun(path(
  line(v2(f1.sx + GAP, BAR), v2(f1.rx, BAR)),
  new THREE.CubicBezierCurve(v2(f1.rx, BAR), v2(f1.rx + BEND, BAR), v2(ENTRY_END - BEND, 0), v2(ENTRY_END, 0)),
));
link(f1.bar.last, entry.first);

// The 0 is one loop: in at its left side, up and over the top and all the way round, back up to
// just short of where it started. The way on to the second 4 branches off its right side. (Two
// arcs that split at the left and met head on at the right left a pile-up of crossed and
// propped blocks there.) The opening at 9 o'clock is where the run comes in: the falling block
// passes between the loop's two ends there, and a loop closed across it got knocked sideways.
const loop = addRun(new THREE.EllipseCurve(0, 0, RX, RZ, Math.PI + GAP / RZ, 3 * Math.PI - Math.asin(1.1 / RZ), false, 0));
link(entry.last, loop.first, true);
const rightmost = loop.ids.reduce((a, b) => (pieces[b].restPos.x > pieces[a].restPos.x ? b : a));

// It leaves already angled down, like a 4's diagonal leaving its bar, so its first block falls in
// line with the rest of the bend (leaving straight out, it lay crosswise on its own).
const exit = addRun(new THREE.CubicBezierCurve(v2(RX + 0.5, 0.1), v2(RX + 1.0, 0.45), v2(RIGHT - STEP - (NARROW ? 0.55 : 0.8), BAR), v2(RIGHT - STEP, BAR)));
link(rightmost, exit.first, true);

const f2 = four(RIGHT, exit.last);

// Second 4 → home: the bar carries on, hooks down and runs into the home block, which falls
// toward you and lands face up.
const HOOK_R = 1.4;
const hook = addRun(path(
  line(v2(f2.sx + GAP, BAR), v2(f2.rx, BAR)),
  new THREE.EllipseCurve(f2.rx, BAR + HOOK_R, HOOK_R, HOOK_R, -Math.PI / 2, 0, false, 0),
  line(v2(f2.rx + HOOK_R, BAR + HOOK_R), v2(f2.rx + HOOK_R, BAR + HOOK_R + (NARROW ? 0.9 : 1.7))),
));
link(f2.bar.last, hook.first);
const homeAt = pieces[hook.last].restPos;
const HOME_ID = addPiece(homeAt.x, homeAt.z + STEP + HOME.t / 2, 0, 1, 'home');
link(hook.last, HOME_ID, true);

const dominoes = pieces.filter((p) => p.kind === 'domino');
const home = pieces[HOME_ID];

// Order along the chain (breadth first from the start): drives the rainbow and the stand-up wave.
{
  const queue = [START];
  pieces[START].depth = 0;
  while (queue.length) {
    const p = pieces[queue.shift()];
    for (const { id } of p.next) if (pieces[id].depth < 0) { pieces[id].depth = p.depth + 1; queue.push(id); }
  }
}
const MAX_DEPTH = Math.max(...pieces.map((p) => p.depth));

// ---------------------------------------------------------------------------------------------
// Renderer, light and materials
// ---------------------------------------------------------------------------------------------
const canvas = $('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (err) {
  document.documentElement.classList.add('no-gl');
  throw err;
}
// full resolution on 3x phones (their screens are small, so it costs no more than 2x on a laptop)
renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth * innerHeight < 600000 ? 3 : 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();   // no background: the page's CSS gradient shows through
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(26, 1, 1, 400);

const sun = new THREE.DirectionalLight('#fff4e4', 2.5);
sun.position.set(-13, 26, 15);
sun.castShadow = true;
const small = Math.min(innerWidth, innerHeight) < 700;
sun.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -27, right: 27, top: 22, bottom: -22, near: 1, far: 90 });
sun.shadow.radius = 2.5;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.015;
scene.add(sun, sun.target, new THREE.HemisphereLight('#ffffff', '#d9ccb6', 0.45));

// The glass marbles bend what is behind them, and a CSS background isn't in the scene, so the
// scene keeps a copy of the same static gradient that only the glass sees: it is drawn in the
// marbles' refraction pass and discarded in the main render, where the CSS shows instead.
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false, toneMapped: false,
    uniforms: { uBehindGlass: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }',
    fragmentShader: `uniform float uBehindGlass;
      varying vec2 vUv;
      // one CSS radial-gradient layer: an ellipse with radii r at c, its alpha falling over five stops
      float layer(vec2 c, vec2 r, float a0, float a1, float a2, float a3, float a4) {
        float d = length((vec2(vUv.x, 1.0 - vUv.y) - c) / r);
        float a = d < 0.2 ? mix(a0, a1, d / 0.2) : d < 0.4 ? mix(a1, a2, (d - 0.2) / 0.2) : d < 0.6 ? mix(a2, a3, (d - 0.4) / 0.2) : d < 0.8 ? mix(a3, a4, (d - 0.6) / 0.2) : mix(a4, 0.0, clamp((d - 0.8) / 0.2, 0.0, 1.0));
        return a;
      }
      void main() {
        if (uBehindGlass < 0.5) discard;
        vec3 col = vec3(244.0, 235.0, 221.0) / 255.0;
        col = mix(col, vec3(207.0, 208.0, 231.0) / 255.0, layer(vec2(0.5, 1.0), vec2(0.66, 0.56), 0.57, 0.42, 0.24, 0.09, 0.02));
        col = mix(col, vec3(201.0, 220.0, 196.0) / 255.0, layer(vec2(0.0, 1.0), vec2(0.78, 0.78), 0.55, 0.4, 0.23, 0.09, 0.02));
        col = mix(col, vec3(235.0, 201.0, 198.0) / 255.0, layer(vec2(1.0, 0.0), vec2(0.85, 0.8), 0.8, 0.62, 0.38, 0.17, 0.05));
        gl_FragColor = vec4(pow(col, vec3(2.2)), 1.0);   // mixed in sRGB like CSS, handed over as linear
        #include <colorspace_fragment>
      }`,
  }),
);
backdrop.onBeforeRender = (r) => { backdrop.material.uniforms.uBehindGlass.value = r.getRenderTarget() ? 1 : 0; };
backdrop.frustumCulled = false;
backdrop.renderOrder = -100;
scene.add(backdrop);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShadowMaterial({ color: '#4a3622', opacity: 0.24 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Painted wood: a pale grain texture that the paint colour multiplies, under a lacquer coat.
function grain() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f4f4';
  g.fillRect(0, 0, 256, 512);
  for (let i = 0; i < 80; i++) {
    const x0 = rand() * 256, amp = 2 + rand() * 7, freq = 0.004 + rand() * 0.012, ph = rand() * 6.3;
    g.strokeStyle = `rgba(70, 50, 30, ${0.06 + rand() * 0.11})`;
    g.lineWidth = 0.6 + rand() * 2.4;
    g.beginPath();
    for (let y = 0; y <= 512; y += 8) {
      const x = x0 + Math.sin(y * freq + ph) * amp;

// ---------------------------------------------------------------------------------------------
// Physics (Rapier, loaded after the page shows)
// ---------------------------------------------------------------------------------------------
let RAPIER = null, world = null;
const marbles = [];

const GROUP_PIECE = (0x1 << 16) | 0xffff, GROUP_MARBLE = (0x2 << 16) | 0xffff, GROUP_EDGE = (0x4 << 16) | 0x2;
let edges = null;

// Invisible edges along the four sides of the screen, so a marble bounces back instead of
// rolling off the page. They are the screen itself, so a marble can start anywhere you can
// press (an edge above the caption stopped throws from the bottom). Only marbles touch them.
function buildEdges() {
  if (!world) return;
  if (edges) world.removeRigidBody(edges);
  edges = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
  const pts = [[0, 0], [view.w, 0], [view.w, view.h], [0, view.h]].map(([x, y]) => floorAt(x, y));
  if (pts.some((q) => !q)) return;
  const centre = pts.reduce((c, q) => c.add(q), new THREE.Vector3()).multiplyScalar(0.25);
  for (let i = 0; i < 4; i++) {
    const a = pts[i], b = pts[(i + 1) % 4];
    const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
    const n = new THREE.Vector3(-dz / len, 0, dx / len);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    if (n.dot(mid.clone().sub(centre)) < 0) n.negate();
    const at = mid.addScaledVector(n, 0.5);
    world.createCollider(
      RAPIER.ColliderDesc.cuboid(len / 2 + 1, 1.5, 0.5)
        .setTranslation(at.x, 1.5, at.z)
        .setRotation(new THREE.Quaternion().setFromAxisAngle(Y, Math.atan2(-dz, dx)))
        .setRestitution(0.55).setFriction(0.1)
        .setCollisionGroups(GROUP_EDGE),
      edges,
    );
  }
}
const state = { mode: 'boot', started: false, arrived: false, down: 0, queued: null, standT0: 0, standEnd: 0, after: null };

async function startPhysics() {
  RAPIER = await import(RAPIER_URL);
  await RAPIER.init();
  world = new RAPIER.World({ x: 0, y: -GRAVITY, z: 0 });
  world.timestep = 1 / 120;
  world.numSolverIterations = 6;
  world.createCollider(RAPIER.ColliderDesc.cuboid(120, 0.5, 120).setTranslation(0, -0.5, 0).setFriction(0.75));
  // The pieces never sleep: a sleeping domino soaks up the hit for a step before it wakes,
  // and the run crawls instead of picking up speed.
  for (const p of pieces) {
    p.body = world.createRigidBody(
      RAPIER.RigidBodyDesc.dynamic()
        .setTranslation(p.restPos.x, p.restPos.y, p.restPos.z)
        .setRotation(p.restQuat)
        .setCanSleep(false)
        .setLinearDamping(0.02)
        .setAngularDamping(0.05),
    );
    world.createCollider(
      RAPIER.ColliderDesc.cuboid(p.w / 2, p.h / 2, p.t / 2).setDensity(p.kind === 'home' ? 0.45 : 1).setFriction(0.45).setRestitution(0.02).setCollisionGroups(GROUP_PIECE),
      p.body,
    );

}

function settle() {
  // Put every body on its resting pose, asleep, and hand the scene to physics.
  for (const p of pieces) {
    p.pos.copy(p.restPos); p.quat.copy(p.restQuat); p.up.set(0, 1, 0);
    p.tilt = 0; p.fired = false; p.down = false; p.dir = 0; p.slept = false; p.landed = false;
    draw(p);
    if (p.body) {
      p.body.setTranslation(p.restPos, false);
      p.body.setRotation(p.restQuat, false);
      p.body.setLinvel({ x: 0, y: 0, z: 0 }, false);
      p.body.setAngvel({ x: 0, y: 0, z: 0 }, false);
    }
  }
  dominoMesh.instanceMatrix.needsUpdate = true;
  state.down = 0;
  state.arrived = false;
  pending.length = 0;
  $('home').classList.remove('arrived');
  $('sub').textContent = 'Give the first block a push and watch your way home unfold.';
  state.mode = world ? 'play' : 'static';
  showReset(false);   // nothing to stand up until something falls
  for (const m of marbles) if (m.queued && !m.dying) { const q = m.queued; m.queued = null; release(m, q.vel, q.fresh); }

}

  $('sub').textContent = 'Give the first block a push and watch your way home unfold.';
  pending.length = 0;
  const now = performance.now();
  const spacing = intro ? 1500 / MAX_DEPTH : 1100 / MAX_DEPTH;
  for (const p of pieces) {
    p.fromPos = intro ? lyingPos(p) : p.pos.clone();
    p.fromQuat = intro ? lyingQuat(p) : p.quat.clone();
    p.delay = p.depth * spacing;
    if (p.kind === 'home') p.delay += 120;
    // already standing pieces stay put
    p.still = !intro && p.tilt < UPRIGHT && p.pos.distanceTo(p.restPos) < 0.02;
  }
  state.standT0 = now;
  state.standEnd = now + MAX_DEPTH * spacing + 600;

const easeOut = (k) => 1 - Math.pow(1 - k, 3);
function animateStand(now) {
  const DUR = 460;
  for (const p of pieces) {

    const k = THREE.MathUtils.clamp((now - state.standT0 - p.delay) / DUR, 0, 1);
    const e = easeOut(k);
    p.pos.lerpVectors(p.fromPos, p.restPos, e);
    p.pos.y += Math.sin(Math.PI * k) * 0.35 * p.h;
    p.quat.slerpQuaternions(p.fromQuat, p.restQuat, e);
    draw(p);
  }
  dominoMesh.instanceMatrix.needsUpdate = true;
  if (now >= state.standEnd) settle();
}

function nudge(id, dir, speed) {

// chain. At the end of a run (the top or bottom of a stem, the end of a diagonal) that means
// backwards; in the middle it means along the run.
// The first block rocks forward a few degrees every few seconds until something falls, so it

    return;
  }
  const first = pieces[START];
  const targets = new Map();   // piece -> [lean, lift]
  if (startShown && hovered !== START && !reduceMotion.matches) {
    const k = (now % 2600) / 2600;
    targets.set(first, [k < 0.4 ? Math.sin((k / 0.4) * Math.PI) * IDLE_LEAN : 0, 0]);
  }

  hoverShadow.material.opacity = Math.min(1, lift / HOVER_LIFT);

function tapDir(p) {

function pushAlong(id, dirVec, speed = 0.75) {

  const p = pieces[id];

  const b = p.body;
  b.wakeUp();
  const m = b.mass() * speed;
  const at = b.translation();
  b.applyImpulseAtPoint({ x: dirVec.x * m, y: 0, z: dirVec.z * m }, { x: at.x + p.up.x * p.h / 2, y: at.y + p.up.y * p.h / 2, z: at.z + p.up.z * p.h / 2 }, true);

// "Stand them up" appears beside "Back to home" once something falls. Back to home glides over
// to make room (and back again) rather than jumping.
function showReset(show) {

  const before = home.getBoundingClientRect().left;
  btn.hidden = !show;
  const dx = before - home.getBoundingClientRect().left;
  if (dx && !reduceMotion.matches) home.animate([{ transform: `translateX(${dx}px)` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.22, .8, .24, 1)' });

function fire(p, now) {

  for (let i = pending.length - 1; i >= 0; i--) {

    if (now < job.at) continue;
    pending.splice(i, 1);
    if (!job.only || job.only()) nudge(job.id, job.dir, job.speed);
  }
}

  for (const p of pieces) {
    const b = p.body;
    const asleep = b.isSleeping();
    if (asleep && p.slept) continue;
    p.slept = asleep;
    const t = b.translation(), r = b.rotation();
    p.pos.set(t.x, t.y, t.z);
    p.quat.set(r.x, r.y, r.z, r.w);
    p.up.set(0, 1, 0).applyQuaternion(p.quat);
    p.tilt = Math.acos(THREE.MathUtils.clamp(p.up.y, -1, 1));
    if (!p.fired && p.tilt > TRIGGER) fire(p, now);

      p.down = true;

    }

    if (p.kind === 'home' && !p.landed && p.tilt > 1.4) { p.landed = true; thud(p); }

const MAX_MARBLES = 6;

    RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(at.x, MARBLE_R, at.z)

  if (!vel) { if (fresh) drop(m); else m.held = false; return; }
  launch(m, vel);
  sfx('launch', Math.min(1, vel.length() / 12.5), m.mesh.position);
}
function removeMarble(m) {
  if (m.dying) return;
  m.dying = performance.now();
  if (world) world.removeRigidBody(m.body);
}
function holdMarbles() {
  for (const m of marbles) {
    if (!m.held || m.dying) continue;
    m.body.setTranslation({ x: m.holdAt.x, y: MARBLE_R, z: m.holdAt.z }, true);
    m.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    m.body.setAngvel({ x: 0, y: 0, z: 0 }, true);

// A slow marble under the caption gets a gentle push out from under the words; a fast one
// just passes through the frost.
const capCentre = new THREE.Vector3();
let capRect = null;
function nudgeFromCaption(m, v) {
  if (!capRect || Math.hypot(v.x, v.z) > 2.5) return;
  const [x, y] = toScreen(m.mesh.position);
  if (x < capRect.left - 16 || x > capRect.right + 16 || y < capRect.top - 16 || y > capRect.bottom + 16) return;
  const dx = m.mesh.position.x - capCentre.x, dz = m.mesh.position.z - capCentre.z;

function readMarbles(now) {

    }
    if (piece) sfx('knock', piece.kind === 'home' ? k * 0.7 : k, at);
    else if (marbles.some((o) => o !== m && !o.dying && o.mesh.position.distanceTo(at) < MARBLE_R * 2 + 0.1)) sfx('clink', k, at);
    else if (Math.abs(dvy) > Math.hypot(dvx, dvz)) sfx('bump', k, at);

}

// ---------------------------------------------------------------------------------------------
// UI state
// ---------------------------------------------------------------------------------------------
function arrive() {
  if (state.arrived) return;
  state.arrived = true;
  finaleTo(true, 450);   // once the sign has landed
  $('home').classList.add('arrived');
  $('sub').textContent = 'Every block went over. The way back is open.';
  $('live').textContent = 'The run reached home. The way back is open.';
}

let startShown = true, marbleTipUsed = false;
function hideStart(hide) {
  startShown = !hide;
}
const keyboard = () => !(coarse.matches || touched) && matchMedia('(hover: hover)').matches;

// The hints are one line written on the floor itself: "Click a block or press Space · drag the
// floor to roll a marble". It is real HTML text mapped onto the floor plane with a perspective
// transform (a homography from four projected corners), so it lies flat like paint and stays
// crisp. It goes in the biggest empty stretch of floor (above the 404, or under the caption on
// a tall phone). Each half drops out once you have done it; where one line would come out too
// small it breaks into two.
let floorTextOn = false;
function quadTransform(w, h, q) {
  // maps the element's (0,0) (w,0) (w,h) (0,h) onto the screen points q[0..3]
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
  const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
  const det = dx1 * dy2 - dx2 * dy1;
  const g = (sx * dy2 - dx2 * sy) / det, k = (dx1 * sy - sx * dy1) / det;
  const a = x1 - x0 + g * x1, b = x3 - x0 + k * x3, d = y1 - y0 + g * y1, e = y3 - y0 + k * y3;
  return `matrix3d(${a / w}, ${d / w}, 0, ${g / w}, ${b / h}, ${e / h}, 0, ${k / h}, 0, 0, 1, 0, ${x0}, ${y0}, 0, 1)`;
}
function placeFloorText() {
  const el = $('floorText');
  floorTextOn = false;
  const cap = $('caption').getBoundingClientRect();
  const art = projected(view.w, view.h);
  const above = { y0: 24, y1: art.y0 - 8 }, below = { y0: cap.bottom + 24, y1: view.h - 56 };
  const region = above.y1 - above.y0 >= below.y1 - below.y0 ? above : below;
  if (region.y1 - region.y0 < 44) { el.classList.remove('on'); return; }
  // size it in world units so its letters come out about 12 px on screen (the element is set at
  // 40 px), smaller only if the region is too short or the line too wide
  let mid = floorAt(view.w / 2, (region.y0 + region.y1) / 2);
  if (!mid) return;
  const [ax] = toScreen(tmp.set(mid.x - 0.5, 0, mid.z)), [bx] = toScreen(tmp.set(mid.x + 0.5, 0, mid.z));
  const perUnit = Math.abs(bx - ax);
  const W = el.offsetWidth, H = el.offsetHeight;
  // aimed at the width a 15–16 px line would have, which the floor's slant brings to ~12 px tall;
  // on a phone a little smaller, so the hint stays quieter than the 404; on a big screen a little
  // bigger, so it keeps pace with the type; never wider than most of the 404 under it
  const TEXT_PX = view.w < 640 ? 13.5 : Math.min(19, 16 * Math.max(1, view.w / 1440));
  let ww = Math.min(W * (TEXT_PX / 40), view.w * (view.w < 640 ? 0.72 : 0.9), (art.x1 - art.x0) * 0.8) / perUnit;
  const fits = (region.y1 - region.y0) * 0.8 / (H / W * perUnit * Math.sin(ELEV));
  ww = Math.min(ww, fits);
  const hh = ww * H / W;
  // Above the 404 it sits close over the art (a short step up from it, not adrift in the middle
  // of the empty band); below the caption it sits a short step under it.
  const tall = hh * perUnit * Math.sin(ELEV);
  const gap = Math.min(view.w < 640 ? 48 : 36, (region.y1 - region.y0 - tall) / 2);
  const cy = region === above ? region.y1 - gap - tall / 2 : region.y0 + gap + tall / 2;
  mid = floorAt(view.w / 2, cy) || mid;
  const q = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => toScreen(tmp.set(mid.x + sx * ww / 2, 0, mid.z + sz * hh / 2)));
  // Painted dead on the floor, the line fans out: the left half leans like italics and the right
  // half leans back. Keep the depth but take most of the fan out, so it reads as upright type.
  for (const [far, near] of [[0, 3], [1, 2]]) q[far][0] = q[near][0] + (q[far][0] - q[near][0]) * 0.3;
  el.style.transform = quadTransform(W, H, q);

  return (q[3][1] - q[0][1]) / el.children.length * (40 / (H / el.children.length));   // one line's letter height on screen
}
let floorKey = '';
function floorParts() {
  const parts = [];
  if (startShown) parts.push(keyboard() ? 'Click a block or press Space' : 'Tap a block');
  // on a phone the line is shorter, so it stays quieter than the 404 above it
  if (!marbleTipUsed) parts.push(keyboard() ? 'drag the floor to roll a marble' : 'swipe to roll a marble');
  return parts;
}
function layFloorText(parts, split) {
  const el = $('floorText');
  el.replaceChildren(...(split ? parts : [parts.join(' · ')]).map((t) => Object.assign(document.createElement('div'), { textContent: t })));
  return placeFloorText();
}
function showFloorText() {
  const parts = floorParts();
  const key = parts.join('|') + view.w + 'x' + view.h;
  if (key !== floorKey) {
    floorKey = key;
    // one line on wider screens; on a phone a line per hint
    if (parts.length) layFloorText(parts, view.w < 640 && parts.length > 1);
  }
  $('floorText').classList.toggle('on', floorTextOn && parts.length > 0 && state.mode === 'play' && finale.k === 0);
}

function run() {
  // Push the first domino; if anything has fallen, stand them all up first so the run is whole.
  ensureAudio();
  const first = pieces[START];
  const whole = pieces.every((p) => p.tilt < UPRIGHT);
  if (state.mode === 'play' && whole && !first.fired) { nudge(START, 1, 1.1); return; }
  state.queued = () => nudge(START, 1, 1.1);
  if (state.mode === 'play') standUp();
}
function reset() {
  ensureAudio();
  if (state.mode === 'play' || state.mode === 'static') standUp();
}

$('reset').addEventListener('click', reset);
$('sound').addEventListener('click', () => {
  soundOn = !soundOn;
  ensureAudio();
  if (master) master.gain.value = soundOn ? 0.7 : 0;
  // the label says what a press will do: "Sound on" read as either a state or an action
  $('sound').textContent = soundOn ? 'Mute' : 'Unmute';
});
addEventListener('keydown', (e) => {
  if (e.target.closest?.('button, a, input')) return;
  if (e.code === 'Space') { e.preventDefault(); run(); }
  else if (e.key === 'r' || e.key === 'R') reset();
});
let touched = false;   // a finger has been used here, whatever the media query says

// ---------------------------------------------------------------------------------------------
// Pointer: tap a block to push it along its run, drag a block to flick it any way, drag the
// floor to roll a marble, tap the floor to drop one. Once home has fallen, tap it to go home.
// ---------------------------------------------------------------------------------------------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const ground = new THREE.Plane(Y, 0);
let press = null, hovered = -1;

function setRay(e) {
  ndc.set((e.clientX / view.w) * 2 - 1, -(e.clientY / view.h) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function floorPoint(e, out = new THREE.Vector3()) {
  setRay(e);
  return ray.ray.intersectPlane(ground, out);
}
function floorAt(x, y) { return floorPoint({ clientX: x, clientY: y }); }
function pickMarble(e) {
  setRay(e);
  const live = marbles.filter((m) => !m.dying);
  const hit = ray.intersectObjects(live.map((m) => m.mesh), true)[0];
  if (hit) return live.find((m) => m.mesh === hit.object.parent) ?? null;
  // generous on touch, and marbles are small: the nearest one within a fingertip
  const tol = e.pointerType === 'touch' || coarse.matches ? 30 : 14;
  let best = null, bestD = tol;
  for (const m of live) {
    const [x, y] = toScreen(m.mesh.position);
    const d = Math.hypot(x - e.clientX, y - e.clientY);
    if (d < bestD) { bestD = d; best = m; }
  }
  return best;
}
function pick(e) {
  setRay(e);
  const hit = ray.intersectObject(dominoMesh, false)[0];
  if (hit && hit.instanceId != null) {
    const p = dominoes[hit.instanceId];
    if (p.tilt < UPRIGHT) return p.id;
  }
  // Generous on touch: the nearest standing domino within a fingertip of the press.
  const tol = e.pointerType === 'touch' || coarse.matches ? 26 : 10;
  let best = -1, bestD = tol;
  for (const p of dominoes) {
    if (p.tilt >= UPRIGHT) continue;
    const [x, y] = toScreen(tmp.copy(p.pos));
    const dd = Math.hypot(x - e.clientX, y - e.clientY);
    if (dd < bestD) { bestD = dd; best = p.id; }
  }
  return best;
}
function overHome(e) {
  if (!state.arrived) return false;
  setRay(e);
  return ray.intersectObject(homeMesh, true).length > 0;
}
// The hovered block answers by itself (see updateLeans): it rises a little, tilts the way a click
// would tip it, and the shadow under it deepens. No colour change, no extra UI.
function highlight(id) {
  hovered = id;
}

canvas.addEventListener('pointerdown', (e) => {
  if (!e.isPrimary) return;
  ensureAudio();
  if (e.pointerType === 'touch') touched = true;
  canvas.setPointerCapture(e.pointerId);
  if (overHome(e)) { press = { kind: 'home', x: e.clientX, y: e.clientY }; return; }
  // marbles work while the blocks stand back up too; only pushing blocks waits
  if (state.mode !== 'play' && !(state.mode === 'stand' && world)) return;
  const caught = pickMarble(e);
  if (caught) {
    hold(caught);
    press = { kind: 'marble', m: caught, fresh: false, x: e.clientX, y: e.clientY };
    sfx('pick', 0.5, caught.mesh.position);
    canvas.style.cursor = 'grabbing';
    return;
  }
  const id = state.mode === 'play' ? pick(e) : -1;
  const at = floorPoint(e);
  if (id >= 0) press = { kind: 'domino', id, x: e.clientX, y: e.clientY, at };
  else if (at) {
    const m = newMarble(at);
    press = { kind: 'marble', m, fresh: true, x: e.clientX, y: e.clientY };
    sfx('pick', 0.5, at);
    canvas.style.cursor = 'grabbing';
  }
});
const aimDir = new THREE.Vector3();
function aimFrom(m, to) {
  const dx = to.x - m.holdAt.x, dz = to.z - m.holdAt.z;
  const len = Math.min(Math.hypot(dx, dz), 7);
  aimDir.set(dx, 0, dz).normalize();
  return len;
}

canvas.addEventListener('pointermove', (e) => {
  if (!e.isPrimary) return;
  if (press?.kind === 'marble') {
    const to = floorPoint(e);
    if (to) showAim(press.m.holdAt, aimDir, aimFrom(press.m, to));
    return;
  }
  if (press || e.pointerType === 'touch') return;
  if (overHome(e)) { highlight(-1); canvas.style.cursor = 'pointer'; return; }
  if (state.mode === 'play' && pickMarble(e)) { highlight(-1); canvas.style.cursor = 'grab'; return; }
  const id = state.mode === 'play' ? pick(e) : -1;
  highlight(id);
  canvas.style.cursor = id >= 0 ? 'pointer' : state.mode === 'play' ? 'grab' : 'default';
});

canvas.addEventListener('pointerup', (e) => {
  if (!press || !e.isPrimary) return;
  const p = press;
  press = null;
  hideAim();
  canvas.style.cursor = '';
  const moved = Math.hypot(e.clientX - p.x, e.clientY - p.y);
  if (p.kind === 'home') { if (moved < 12 && overHome(e)) location.href = $('home').href; return; }
  if (p.kind === 'marble') {
    if (p.m.dying) return;
    const to = floorPoint(e);
    const len = to ? aimFrom(p.m, to) : 0;
    release(p.m, len < 0.4 ? null : aimDir.clone().multiplyScalar(3 + len * 1.35), p.fresh);
    return;
  }
  if (state.mode !== 'play') return;
  if (p.kind === 'domino') {
    highlight(-1);
    const to = floorPoint(e);
    if (moved < 12 || !to || !p.at) { nudge(p.id, tapDir(pieces[p.id]), 0.75); return; }
    const dir = to.sub(p.at).setY(0);
    if (dir.lengthSq() < 0.01) { nudge(p.id, tapDir(pieces[p.id]), 0.75); return; }
    pushAlong(p.id, dir.normalize(), 0.8);
    return;
  }
});
canvas.addEventListener('pointercancel', () => {
  if (press?.kind === 'marble') press.m.held = false;
  press = null;
  hideAim();
});
canvas.addEventListener('pointerleave', () => { if (!press) highlight(-1); });

// ---------------------------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------------------------
let last = performance.now(), acc = 0, slow = 0, frames = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  // two seconds under ~45 fps steps the pixel ratio down (not below 1) and shadows to 1024
  frames++;
  slow = dt > 1 / 45 ? slow + dt : Math.max(0, slow - dt * 0.5);
  if (slow > 2 && renderer.getPixelRatio() > 1 && frames > 120) {
    slow = 0;
    renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.5));
    if (sun.shadow.mapSize.x > 1024) { sun.shadow.mapSize.set(1024, 1024); sun.shadow.map?.dispose(); sun.shadow.map = null; }
    fit();
  }
  if (state.mode === 'stand') { animateStand(now); readMarbles(now); }
  else if (state.mode === 'play') {
    acc += dt;
    let n = 0;
    while (acc >= world.timestep && n < 8) { holdMarbles(); world.step(); acc -= world.timestep; n++; }
    if (n === 8) acc = 0;
    readPhysics(now);
    runPending(now);
  }
  updateLeans(now, dt);
  stepFinale(now);
  showFloorText();
  renderer.render(scene, camera);
}

fit();
for (const p of pieces) {
  if (!reduceMotion.matches) { p.pos.copy(lyingPos(p)); p.quat.copy(lyingQuat(p)); }
  draw(p);
}
dominoMesh.instanceMatrix.needsUpdate = true;
renderer.setAnimationLoop(frame);
addEventListener('resize', fit);
document.fonts?.ready.then(fit);
requestAnimationFrame(() => canvas.classList.add('on'));

if (reduceMotion.matches) settle(); else { state.mode = 'boot'; setTimeout(() => standUp({ intro: true }), 250); }
startPhysics().catch((err) => {
  console.error('Physics failed to load', err);
  $('sub').textContent = 'The dominoes could not load here. The way home still works.';
});

// For the QA scripts.
window.Domino = {
  pieces, START, HOME_ID, thudAt: () => thudAt,
  state: () => ({ mode: state.mode, down: state.down, total: dominoes.length, arrived: state.arrived, marbles: marbles.filter((m) => !m.dying).length, physics: !!world, pixelRatio: renderer.getPixelRatio(), finale: +finale.k.toFixed(2) }),
  marble: () => { const m = marbles.filter((q) => !q.dying).at(-1); if (!m) return null; const v = m.body.linvel(); return { x: +m.mesh.position.x.toFixed(2), y: +m.mesh.position.y.toFixed(2), z: +m.mesh.position.z.toFixed(2), speed: +Math.hypot(v.x, v.z).toFixed(2), held: m.held }; },
  edges: () => edges ? edges.numColliders() : 0,
  sounds: () => soundLog.slice(),
  project: (v) => toScreen(tmp.set(v.x, v.y, v.z)),
  marbleList: () => marbles.filter((m) => !m.dying).map((m) => ({ x: m.mesh.position.x, y: m.mesh.position.y, z: m.mesh.position.z, held: m.held })),
  run, reset,
  screen: (id) => toScreen(tmp.copy(pieces[id].pos)),
  overlaps() {
    // Footprints that intersect at rest (separating axis test on the floor rectangles).
    const rect = (p) => {
      const f = new THREE.Vector2(p.fwd.x, p.fwd.z), s = new THREE.Vector2(-f.y, f.x), c = new THREE.Vector2(p.restPos.x, p.restPos.z);
      return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) => c.clone().addScaledVector(f, a * p.t / 2).addScaledVector(s, b * p.w / 2));
    };
    const axes = (r) => [r[1].clone().sub(r[0]).normalize(), r[3].clone().sub(r[0]).normalize()];
    const apart = (a, b) => [...axes(a), ...axes(b)].some((ax) => {
      const pa = a.map((v) => v.dot(ax)), pb = b.map((v) => v.dot(ax));
      return Math.max(...pa) < Math.min(...pb) || Math.max(...pb) < Math.min(...pa);
    });
    const rs = pieces.map(rect), out = [];
    for (let i = 0; i < rs.length; i++) for (let j = i + 1; j < rs.length; j++) if (!apart(rs[i], rs[j])) out.push([i, j]);
    return out;
  },
};
